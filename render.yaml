# Render Blueprint for the Ipon API (Express + Neon Postgres).
# Render → New → Blueprint → pick this repo. Then fill in the values marked "sync: false".
services:
  - type: web
    name: ipon-api
    runtime: node
    plan: free
    region: singapore # closest to the Philippines
    # Install only the server + shared code (not the mobile app), then apply DB migrations.
    buildCommand: npm ci --workspace=@ft/server --workspace=@ft/shared --include-workspace-root && npm run migrate
    startCommand: npm start -w @ft/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: JWT_SECRET # random, generated by Render; never stored in the repo
        generateValue: true
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon direct connection string (used for migrations)
        sync: false
      - key: CORS_ORIGINS # your Vercel website URL, e.g. https://ipon.vercel.app
        sync: false
